# Back-office (agents, validateurs, administrateurs)
server {
    listen 80;
    root /usr/share/nginx/backoffice;
    include /etc/nginx/conf.d/spa.inc;
}

# Espace étudiant « Mes documents officiels »
server {
    listen 8082;
    root /usr/share/nginx/etudiant;
    include /etc/nginx/conf.d/spa.inc;
}
