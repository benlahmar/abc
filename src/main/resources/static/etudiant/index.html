<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes documents</title>
  <link rel="stylesheet" href="portail.css">
</head>
<body>
<header class="bar">
  <div>
    <div class="univ" id="univ">Université</div>
    <div class="fac" id="fac"></div>
  </div>
  <div class="who" id="who" hidden>
    <span id="student"></span>
    <button type="button" class="link" id="logout">Se déconnecter</button>
  </div>
</header>

<main>
  <section id="login" class="card center" hidden>
    <h1>Mes documents officiels</h1>
    <p>Attestations de scolarité et relevés de notes signés électroniquement.</p>
    <button type="button" id="login-btn" class="primary">Se connecter avec mon compte de l'université</button>
  </section>

  <div id="app" hidden>
    <div id="flash" role="status" aria-live="polite"></div>

    <section class="card">
      <h2>Mes documents</h2>
      <p class="muted" id="docs-empty" hidden>Aucun document pour le moment.</p>
      <ul class="list" id="docs"></ul>
    </section>

    <section class="card" id="request-card" hidden>
      <h2>Demander un document</h2>
      <form id="request-form">
        <label>Document
          <select name="type" id="req-type" required></select>
        </label>
        <div class="row">
          <label>Année universitaire
            <input name="academicYear" id="req-year" required pattern="\d{4}-\d{4}" placeholder="2025-2026">
          </label>
          <label id="semester-field">Semestre
            <select name="semester" id="req-semester">
              <option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option>
              <option>S6</option><option>S7</option><option>S8</option><option>S9</option><option>S10</option>
            </select>
          </label>
        </div>
        <label>Usage (facultatif)
          <select name="purpose" id="req-purpose">
            <option value="">—</option>
            <option value="ETRANGER">Dossier à l'étranger</option>
            <option value="INSCRIPTION">Inscription dans un autre établissement</option>
            <option value="STAGE">Stage / emploi</option>
            <option value="BOURSE">Bourse</option>
          </select>
        </label>
        <p class="muted" id="mode-hint"></p>
        <button type="submit" class="primary">Envoyer la demande</button>
      </form>
    </section>

    <section class="card">
      <h2>Mes demandes</h2>
      <p class="muted" id="reqs-empty" hidden>Aucune demande.</p>
      <ul class="list" id="reqs"></ul>
    </section>
  </div>
</main>

<script src="portail.js"></script>
</body>
</html>
