spring:
  application:
    name: esign-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esign}
    username: ${DB_USER:esign}
    password: ${DB_PASSWORD:esign}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Émetteur des jetons (Keycloak de l'université). La claim "iss" est vérifiée.
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/universite}
          # Optionnel : URL interne des clés publiques, utile en Docker quand l'émetteur public diffère
          # (variable SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI).

esign:
  # URL publique imprimée dans le QR code
  public-base-url: ${ESIGN_PUBLIC_BASE_URL:http://localhost:8080}
  institution:
    university: ${ESIGN_UNIVERSITY:Université Hassan II de Casablanca}
    faculty: ${ESIGN_FACULTY:Faculté des Sciences Ben M'Sick}
    short-name: ${ESIGN_SHORT_NAME:FSBM}
    city: ${ESIGN_CITY:Casablanca}
    signatory-title: ${ESIGN_SIGNATORY_TITLE:Le Doyen}
    # Logo (PNG) sur les documents et les applications ; ex. ESIGN_LOGO=file:/config/logo.png
    logo: ${ESIGN_LOGO:classpath:static/branding/logo.png}
    zone: ${ESIGN_ZONE:Africa/Casablanca}
  signing:
    # PKCS12 (fichier .p12) ou PKCS11 (HSM)
    token-type: ${ESIGN_TOKEN_TYPE:PKCS12}
    # PAdES_BASELINE_B | PAdES_BASELINE_T | PAdES_BASELINE_LT | PAdES_BASELINE_LTA
    level: ${ESIGN_SIGNATURE_LEVEL:PAdES_BASELINE_B}
    tsa-url: ${ESIGN_TSA_URL:}
    pkcs12:
      path: ${ESIGN_P12_PATH:./data/pki/cachet.p12}
      password: ${ESIGN_P12_PASSWORD:}
      alias: ${ESIGN_P12_ALIAS:}
    pkcs11:
      library: ${ESIGN_PKCS11_LIBRARY:}
      slot-index: ${ESIGN_PKCS11_SLOT_INDEX:0}
      pin: ${ESIGN_PKCS11_PIN:}
      alias: ${ESIGN_PKCS11_ALIAS:}
    dev-auto-generate: false
  validation:
    # Ancres de confiance supplémentaires (fichiers PEM), ex. variable
    # ESIGN_VALIDATION_TRUSTED_CERTIFICATES=/pki/ac-racine.pem,/pki/ac-intermediaire.pem
    online: ${ESIGN_VALIDATION_ONLINE:false}
  storage:
    base-dir: ${ESIGN_STORAGE_DIR:./data/storage}
  student:
    # Claim du jeton contenant le CNE de l'étudiant (attribut de l'annuaire / Keycloak)
    cne-claim: ${ESIGN_STUDENT_CNE_CLAIM:cne}
    role: ${ESIGN_STUDENT_ROLE:ETUDIANT}
    portal-client-id: ${ESIGN_STUDENT_PORTAL_CLIENT_ID:esign-etudiant}
  cors:
    # Applications web de la fac autorisées à appeler l'API depuis le navigateur, séparées par des virgules
    # ex. ESIGN_CORS_ALLOWED_ORIGINS=https://ent.universite.ma,https://mobile.universite.ma
    allowed-origins: ${ESIGN_CORS_ALLOWED_ORIGINS:}
  apogee:
    # Correspondance donnée -> nom de colonne dans les exports CSV/Excel et dans la vue Oracle.
    # Adapter aux noms réels de vos exports (ex. cne: COD_NNE_IND, nom: LIB_NOM_PAT_IND, annee: COD_ANU).
    columns:
      cne: ${APOGEE_COL_CNE:CNE}
      nom: ${APOGEE_COL_NOM:NOM}
      prenom: ${APOGEE_COL_PRENOM:PRENOM}
      date-naissance: ${APOGEE_COL_DATE_NAISSANCE:DATE_NAISSANCE}
      lieu-naissance: ${APOGEE_COL_LIEU_NAISSANCE:LIEU_NAISSANCE}
      filiere: ${APOGEE_COL_FILIERE:FILIERE}
      niveau: ${APOGEE_COL_NIVEAU:NIVEAU}
      annee: ${APOGEE_COL_ANNEE:ANNEE}
      semestre: ${APOGEE_COL_SEMESTRE:SEMESTRE}
      code-module: ${APOGEE_COL_CODE_MODULE:CODE_MODULE}
      module: ${APOGEE_COL_MODULE:MODULE}
      note: ${APOGEE_COL_NOTE:NOTE}
      credits: ${APOGEE_COL_CREDITS:CREDITS}
      resultat: ${APOGEE_COL_RESULTAT:RESULTAT}
    view:
      # Vue Oracle d'Apogée, en lecture seule (compte avec le seul droit SELECT sur la vue)
      enabled: ${APOGEE_VIEW_ENABLED:false}
      url: ${APOGEE_VIEW_URL:}
      username: ${APOGEE_VIEW_USER:}
      password: ${APOGEE_VIEW_PASSWORD:}
      name: ${APOGEE_VIEW_NAME:V_ESIGN_NOTES}
      # FULL : "2025-2026" ; START : "2025" (comme COD_ANU)
      year-format: ${APOGEE_VIEW_YEAR_FORMAT:FULL}

springdoc:
  swagger-ui:
    oauth:
      # Connexion des personnes depuis Swagger UI (bloc « personne »)
      client-id: esign-swagger
      use-pkce-with-authorization-code-grant: true
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
