<!-- =====================================================================
     Actualités et Annonces — alimenté par /data/news.json
     Filtre par catégorie, article à la une + fil, pièces jointes repliables.
     ===================================================================== -->
<section id="actualites" aria-labelledby="news-title" class="py-24 lg:py-32" data-news>
  <div class="container-editorial">
    <header class="grid gap-8 border-b border-midnight pb-10 lg:grid-cols-12 lg:items-end" data-reveal>
      <div class="lg:col-span-7">
        <p class="section-index">04 — Actualités</p>
        <h2 id="news-title" class="mt-6 font-serif text-[clamp(2.4rem,4.6vw,4.25rem)] leading-[1] tracking-[-0.02em] text-balance">
          Actualités <em class="text-bronze italic">et annonces.</em>
        </h2>
      </div>
      <div class="lg:col-span-4 lg:col-start-9">
        <p class="text-[0.9375rem] leading-relaxed text-muted">Inscriptions, résultats, examens et vie de la Faculté&nbsp;: toutes les informations officielles publiées par la FSBM.</p>
        <a href="/actualites" class="group mt-5 inline-flex items-center gap-2 text-sm font-medium">
          <span class="link-rule">Toutes les actualités</span> <span class="arrow-nudge text-bronze" aria-hidden="true">→</span>
        </a>
      </div>
    </header>

    <div class="flex flex-col gap-4 border-b border-midnight/10 py-5 sm:flex-row sm:items-center sm:justify-between">
      <div role="group" aria-label="Filtrer les actualités par catégorie" class="-mx-1 flex flex-wrap gap-1" data-news-filters></div>
      <p class="text-[0.75rem] text-muted" aria-live="polite" data-news-status></p>
    </div>

    <div class="grid gap-14 pt-10 lg:grid-cols-12 lg:gap-0" data-render="news">
      <div class="skeleton h-[28rem] lg:col-span-7"></div>
      <div class="hidden space-y-4 lg:col-span-5 lg:block lg:pl-14">
        <div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div>
      </div>
    </div>

    <div class="mt-10 flex justify-center">
      <button type="button" hidden data-news-more class="group inline-flex items-center gap-3 border border-midnight/80 px-6 py-3 text-[0.8125rem] font-medium transition-colors hover:bg-midnight hover:text-paper">
        Afficher plus d’actualités <span aria-hidden="true" class="transition-transform group-hover:translate-y-0.5">↓</span>
      </button>
    </div>
  </div>
</section>
