<section aria-labelledby="cta-title" class="relative overflow-hidden border-t border-midnight/10 py-24 lg:py-28">

  <div class="container-editorial relative grid gap-10 lg:grid-cols-12 lg:items-end" data-reveal>

      <a href="/accueil/mot-du-doyen" class="inline-flex items-center justify-center gap-3 border border-midnight/80 px-7 py-4 text-[0.875rem] font-medium tracking-wide transition-colors hover:bg-midnight hover:text-paper">
