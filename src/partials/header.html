<!-- =====================================================================
     En-tête — barre de contact, navigation principale et méga-menus.
     Les coordonnées portant data-bind sont mises à jour depuis site.json.
     Comportement : src/js/modules/header.js, mega-menu.js, mobile-nav.js
     ===================================================================== -->
<header
  data-header
  class="group/header sticky top-0 z-50 border-b border-midnight/10 bg-paper/80 backdrop-blur-md transition-shadow duration-500 data-[scrolled]:shadow-[0_1px_0_rgb(10_25_47/0.04),0_12px_32px_-20px_rgb(10_25_47/0.35)] supports-[not(backdrop-filter:blur(0))]:bg-paper"
>
  <!-- Barre de contact : se replie au défilement -->
  <div class="hidden grid-rows-[1fr] transition-[grid-template-rows] duration-500 ease-editorial group-data-[scrolled]/header:grid-rows-[0fr] md:grid">
    <div class="overflow-hidden">
      <div class="on-dark bg-midnight text-paper/75">
        <div class="container-editorial flex h-9 items-center justify-between text-[0.75rem]">
          <ul class="flex items-center gap-6" aria-label="Coordonnées">
            <li>
              <a data-bind-href="mailto:contact.email" href="mailto:fsbm.contact@univh2c.ma" class="flex items-center gap-2 transition-colors hover:text-gold">
                <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5"><rect x="1.5" y="3.5" width="13" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="m2 4 6 5 6-5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
                <span data-bind="contact.email">fsbm.contact@univh2c.ma</span>
              </a>
            </li>
            <li>
              <a data-bind-href="tel:contact.phone" href="tel:+212661442427" class="flex items-center gap-2 transition-colors hover:text-gold">
                <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5"><path d="M4.5 1.8 6.3 5 5 6.4a8.5 8.5 0 0 0 4.6 4.6L11 9.7l3.2 1.8-.6 2.2c-.2.6-.8 1-1.4.9C6.6 14 2 9.4 1.4 3.8c-.1-.6.3-1.2.9-1.4z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
                <span data-bind="contact.phoneDisplay">(+212) 6 61 44 24 27</span>
              </a>
            </li>
          </ul>
          <div class="flex items-center gap-6">
            <a href="/contact" class="link-rule transition-colors hover:text-gold">Contact</a>
            <ul class="flex items-center gap-3 border-l border-paper/15 pl-6" aria-label="Réseaux sociaux" data-render="socials"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-editorial flex h-[4.5rem] items-center justify-between gap-3 sm:gap-6 xl:h-20">
    <!-- Identité -->
    <a href="/" class="group flex shrink-0 items-center gap-3 sm:gap-3.5" aria-label="Faculté des Sciences Ben M'Sik — accueil">
      <span aria-hidden="true" class="relative grid h-10 place-items-center bg-midnight px-2 font-sans text-[0.8125rem] font-semibold tracking-[0.08em] text-paper">
        FSBM
        <span class="absolute top-0 left-0 size-2.5 origin-top-left bg-gold transition-transform duration-500 ease-editorial [clip-path:polygon(0_0,100%_0,0_100%)] group-hover:scale-150"></span>
      </span>
      <span aria-hidden="true" class="flex flex-col leading-none">
        <span class="font-serif text-[1.3rem] font-medium tracking-tight">Faculté des Sciences</span>
        <span class="mt-1 text-[0.5625rem] font-semibold tracking-[0.14em] text-muted uppercase">Ben M’Sik <span class="text-gold">·</span> <span class="sm:hidden">UH2C</span><span class="hidden sm:inline">Université Hassan II</span></span>
      </span>
    </a>

    <!-- Navigation principale (bureau) -->
    <nav aria-label="Navigation principale" class="hidden h-full xl:block">
      <ul class="flex h-full items-stretch">
        <li class="flex">
          <button type="button" data-mega-trigger aria-expanded="false" aria-controls="mega-accueil" class="nav-trigger group">
            Accueil
            <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted transition-transform duration-300 group-aria-expanded:rotate-180"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
          </button>
        </li>
        <li class="flex"><a href="/actualites" class="nav-trigger">Actualités</a></li>
        <li class="flex">
          <button type="button" data-mega-trigger aria-expanded="false" aria-controls="mega-formation" class="nav-trigger group">
            Formation
            <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted transition-transform duration-300 group-aria-expanded:rotate-180"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
          </button>
        </li>
        <li class="flex"><a href="/departements" class="nav-trigger">Départements</a></li>
        <li class="flex"><a href="/recherche" class="nav-trigger">Recherche</a></li>
        <li class="flex"><a href="/services" class="nav-trigger">Services</a></li>
        <li class="flex"><a href="/etudiant" class="nav-trigger">Étudiant</a></li>
        <li class="flex"><a href="/partenariat" class="nav-trigger">Partenariat</a></li>
      </ul>
    </nav>

    <div class="flex items-center gap-1 sm:gap-3">
      <a href="/recherche-site" class="grid size-10 place-items-center text-midnight/70 transition-colors hover:text-midnight" aria-label="Rechercher sur le site">
        <svg aria-hidden="true" viewBox="0 0 20 20" class="size-[1.125rem]"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.4"/></svg>
      </a>

      <!-- Bouton fantôme : portail étudiant -->
      <a
        href="/portail-etudiant"
        class="group relative hidden items-center gap-2.5 overflow-hidden border border-midnight/80 px-4 py-2.5 text-[0.8125rem] font-medium tracking-wide whitespace-nowrap text-midnight transition-colors duration-500 ease-editorial hover:text-paper sm:inline-flex"
      >
        <span aria-hidden="true" class="absolute inset-0 -z-10 origin-bottom scale-y-0 bg-midnight transition-transform duration-500 ease-editorial group-hover:scale-y-100 group-focus-visible:scale-y-100"></span>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 text-bronze transition-colors group-hover:text-gold"><rect x="3" y="7" width="10" height="7" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
        Portail Étudiant
      </a>

      <button type="button" data-mobile-toggle aria-expanded="false" aria-controls="mobile-nav" class="grid size-10 place-items-center xl:hidden">
        <span class="sr-only">Ouvrir le menu</span>
        <span aria-hidden="true" class="flex w-6 flex-col items-end gap-[5px]">
          <span class="block h-px w-6 bg-midnight"></span>
          <span class="block h-px w-4 bg-midnight"></span>
          <span class="block h-px w-6 bg-midnight"></span>
        </span>
      </button>
    </div>
  </div>

  <include src="mega-accueil.html" />
  <include src="mega-formation.html" />
</header>

<div data-mega-scrim aria-hidden="true" class="pointer-events-none fixed inset-0 z-40 bg-midnight/20 opacity-0 transition-opacity duration-500 data-[open]:pointer-events-auto data-[open]:opacity-100"></div>

<include src="mobile-nav.html" />
