<!-- =====================================================================
     Site header — sticky, frosted, with disclosure-pattern mega menus.
     Behaviour: src/js/modules/header.js
     ===================================================================== -->
<header
  data-header
  class="group/header sticky top-0 z-50 border-b border-midnight/10 bg-paper/80 backdrop-blur-md transition-shadow duration-500 data-[scrolled]:shadow-[0_1px_0_rgb(10_25_47/0.04),0_12px_32px_-20px_rgb(10_25_47/0.35)] supports-[not(backdrop-filter:blur(0))]:bg-paper"
>
  <!-- Utility bar: collapses once the page scrolls -->
  <div
    class="hidden grid-rows-[1fr] transition-[grid-template-rows] duration-500 ease-editorial group-data-[scrolled]/header:grid-rows-[0fr] md:grid"
  >
    <div class="overflow-hidden">
      <div class="container-editorial flex h-9 items-center justify-between border-b border-midnight/[0.06] text-[0.75rem] text-muted">
        <p>Northvale University <span aria-hidden="true" class="mx-2 text-gold">/</span> Est. 1908</p>
        <ul class="flex items-center gap-6" aria-label="Utility">
          <li><a class="link-rule hover:text-midnight" href="/admissions">Admissions</a></li>
          <li><a class="link-rule hover:text-midnight" href="/libraries">Libraries</a></li>
          <li><a class="link-rule hover:text-midnight" href="/staff">Staff</a></li>
          <li><a class="link-rule hover:text-midnight" href="/give">Give</a></li>
          <li class="flex items-center gap-1.5 border-l border-midnight/10 pl-6">
            <a href="/" aria-current="true" lang="en" class="font-semibold text-midnight">EN</a>
            <span aria-hidden="true">·</span>
            <a href="/fr" lang="fr" hreflang="fr" class="link-rule hover:text-midnight"><span class="sr-only">Français</span><span aria-hidden="true">FR</span></a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="container-editorial flex h-[4.5rem] items-center justify-between gap-8 lg:h-20">
    <!-- Wordmark -->
    <a href="/" class="group flex items-center gap-3.5" aria-label="Faculty of Science, Northvale University — home">
      <span aria-hidden="true" class="relative grid size-10 place-items-center bg-midnight font-serif text-[1.45rem] leading-none text-paper">
        S
        <span class="absolute top-0 left-0 size-2.5 bg-gold [clip-path:polygon(0_0,100%_0,0_100%)] transition-transform duration-500 ease-editorial group-hover:scale-150 origin-top-left"></span>
      </span>
      <span aria-hidden="true" class="flex flex-col leading-none">
        <span class="font-serif text-[1.35rem] font-medium tracking-tight">Faculty of Science</span>
        <span class="mt-1 text-[0.625rem] font-semibold tracking-eyebrow text-muted uppercase">Northvale University</span>
      </span>
    </a>

    <!-- Primary navigation (desktop) -->
    <nav aria-label="Primary" class="hidden h-full lg:block" data-mega-nav>
      <ul class="flex h-full items-stretch gap-1">
        <li class="flex">
          <button type="button" data-mega-trigger aria-expanded="false" aria-controls="mega-academics" class="nav-trigger group">
            Academics
            <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted transition-transform duration-300 group-aria-expanded:rotate-180"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
          </button>
        </li>
        <li class="flex">
          <button type="button" data-mega-trigger aria-expanded="false" aria-controls="mega-research" class="nav-trigger group">
            Research
            <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted transition-transform duration-300 group-aria-expanded:rotate-180"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
          </button>
        </li>
        <li class="flex">
          <button type="button" data-mega-trigger aria-expanded="false" aria-controls="mega-campus" class="nav-trigger group">
            Campus Life
            <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted transition-transform duration-300 group-aria-expanded:rotate-180"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
          </button>
        </li>
        <li class="flex">
          <a href="/about" class="relative flex items-center px-4 text-[0.875rem] font-medium text-midnight/80 transition-colors hover:text-midnight">About</a>
        </li>
      </ul>
    </nav>

    <div class="flex items-center gap-2 sm:gap-4">
      <a href="/search" class="grid size-10 place-items-center text-midnight/70 transition-colors hover:text-midnight" aria-label="Search the Faculty site">
        <svg aria-hidden="true" viewBox="0 0 20 20" class="size-[1.125rem]"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.4"/></svg>
      </a>

      <!-- Ghost button: student portal -->
      <a
        href="/portal/login"
        class="group relative hidden items-center gap-2.5 overflow-hidden border border-midnight/80 px-5 py-2.5 text-[0.8125rem] font-medium tracking-wide text-midnight transition-colors duration-500 ease-editorial hover:text-paper sm:inline-flex"
      >
        <span aria-hidden="true" class="absolute inset-0 -z-10 origin-bottom scale-y-0 bg-midnight transition-transform duration-500 ease-editorial group-hover:scale-y-100 group-focus-visible:scale-y-100"></span>
        <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 text-bronze transition-colors group-hover:text-gold"><rect x="3" y="7" width="10" height="7" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
        Student Portal
      </a>

      <button
        type="button"
        data-mobile-toggle
        aria-expanded="false"
        aria-controls="mobile-nav"
        class="grid size-10 place-items-center lg:hidden"
      >
        <span class="sr-only">Open menu</span>
        <span aria-hidden="true" class="flex w-6 flex-col items-end gap-[5px]">
          <span class="block h-px w-6 bg-midnight"></span>
          <span class="block h-px w-4 bg-midnight"></span>
          <span class="block h-px w-6 bg-midnight"></span>
        </span>
      </button>
    </div>
  </div>

  <!-- ===== Mega menu panels ===== -->
  <include src="mega-academics.html" />
  <include src="mega-research.html" />
  <include src="mega-campus.html" />
</header>

<!-- Scrim behind open mega menus -->
<div data-mega-scrim aria-hidden="true" class="pointer-events-none fixed inset-0 z-40 bg-midnight/20 opacity-0 transition-opacity duration-500 data-[open]:pointer-events-auto data-[open]:opacity-100"></div>

<include src="mobile-nav.html" />
