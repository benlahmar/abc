<section id="chiffres-cles" aria-labelledby="impact-title" class="border-t border-midnight/10 bg-paper-dim/60 py-24 lg:py-32" data-stats>
  <div class="container-editorial">
    <header class="grid gap-8 lg:grid-cols-12 lg:items-end" data-reveal>
      <div class="lg:col-span-7">
        <p class="section-index">03 — Chiffres clés <span data-bind="stats.year"></span></p>
        <h2 id="impact-title" class="mt-6 font-serif text-[clamp(2.4rem,4.6vw,4.25rem)] leading-[1] tracking-[-0.02em] text-balance">

        </h2>
      </div>
      <div class="lg:col-span-4 lg:col-start-9">
        <p class="text-[0.9375rem] leading-relaxed text-muted">Effectifs, recherche et partenariats&nbsp;: les indicateurs de la Faculté des Sciences Ben M’Sik.</p>
        <a href="/accueil/chiffres-cles" class="group mt-5 inline-flex items-center gap-2 text-sm font-medium">
          <span class="link-rule">Tous les chiffres clés</span> <span class="arrow-nudge text-bronze" aria-hidden="true">→</span>
        </a>
      </div>
    </header>

    <div class="mt-16 grid gap-4 sm:grid-cols-2 lg:grid-cols-12 lg:gap-5" data-render="stats">
      <div class="skeleton h-80 sm:col-span-2 lg:col-span-6 lg:row-span-2"></div>
      <div class="skeleton h-40 lg:col-span-3"></div>
      <div class="skeleton h-40 lg:col-span-3"></div>
      <div class="skeleton h-40 lg:col-span-3"></div>
      <div class="skeleton h-40 lg:col-span-3"></div>
    </div>
  </div>
</section>
